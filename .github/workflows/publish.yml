# Drop this file into your mod repo at `.github/workflows/publish.yml`.
#
# What it does:
#   1. Triggers when you push a tag like `v1.2.3`.
#   2. Reads `manifest.json#version`, refuses to continue if it doesn't match the tag.
#   3. Zips your mod folder as `<modId>-<version>.zip`.
#   4. Computes the SHA-256 of that zip.
#   5. Creates the GitHub Release (or updates one already created for that tag)
#      and uploads the zip + a `SHA256SUMS.txt` file as assets.
#   6. Prints the exact `index.json` block you need to PR to
#      https://github.com/Toskan4134/maker-studio-mods to update your registry entry.
#
# Required repo secrets / settings: none. The default `GITHUB_TOKEN` is enough to publish
# releases on your own repo.
#
# Optional automation: see the commented `registry-pr` job at the bottom — it will open the
# registry PR for you automatically (adding your entry the first time, bumping it after that)
# if you set a `REGISTRY_PAT` secret (Personal Access Token with `repo` scope) and adjust
# `FORK_OWNER` to your GitHub handle.

name: Publish mod release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      mod-id: ${{ steps.meta.outputs.mod-id }}
      version: ${{ steps.meta.outputs.version }}
      asset-name: ${{ steps.meta.outputs.asset-name }}
      authors: ${{ steps.meta.outputs.authors }}
      sha256: ${{ steps.hash.outputs.sha256 }}
      entry: ${{ steps.hash.outputs.entry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read manifest + validate tag
        id: meta
        run: |
          MOD_ID=$(jq -r '.id' manifest.json)
          MANIFEST_VER=$(jq -r '.version' manifest.json)
          TAG="${GITHUB_REF_NAME}"
          TAG_VER="${TAG#v}"
          if [ "$MANIFEST_VER" != "$TAG_VER" ]; then
            echo "::error::manifest.json#version ($MANIFEST_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          ASSET="${MOD_ID}-${MANIFEST_VER}.zip"
          # Normalize whatever the manifest uses — `authors: [{name, url?}]`, `authors: ["name"]`
          # or a plain `author: "name"` — into the one-line array index.json#authors expects.
          AUTHORS=$(jq -c '[ (.authors // [.author])[] | select(. != null)
                             | if type == "string" then {name: .} else . end ]' manifest.json)
          if [ "$AUTHORS" = "[]" ]; then
            echo '::error::manifest.json needs an author: either "author": "you" or "authors": [{"name": "you"}]'
            exit 1
          fi
          echo "mod-id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "version=$MANIFEST_VER" >> "$GITHUB_OUTPUT"
          echo "asset-name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "authors=$AUTHORS" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          # Zip everything in the repo root EXCEPT git, CI, and dev-only files.
          # The Maker Studio installer expects `manifest.json` at the zip root.
          zip -r "${{ steps.meta.outputs.asset-name }}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "*.zip"

      - name: Compute SHA-256
        id: hash
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset-name }}
          AUTHORS_JSON: ${{ steps.meta.outputs.authors }}
        run: |
          SHA=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  $ASSET_NAME" > SHA256SUMS.txt
          # Whole registry entry, in index.json field order, for the registry-pr job below.
          # Tags are slugged to the registry's `^[a-z0-9-]+$` (so "Terrain Tags" and "19.1"
          # become "terrain-tags" and "19-1"), deduped, capped at the 8 the schema allows.
          ENTRY=$(jq -c --argjson authors "$AUTHORS_JSON" \
                        --arg repo "$GITHUB_REPOSITORY" \
                        --arg asset "$ASSET_NAME" \
                        --arg sha "$SHA" \
                        '{ id, name, authors: $authors, repo: $repo,
                           version, assetName: $asset, sha256: $sha,
                           description,
                           tags: ([ (.tags // [])[] | select(type == "string") | ascii_downcase
                                    | gsub("[àáâãäå]";"a";"i") | gsub("[èéêë]";"e";"i")
                                    | gsub("[ìíîï]";"i";"i")   | gsub("[òóôõö]";"o";"i")
                                    | gsub("[ùúûü]";"u";"i")   | gsub("ñ";"n";"i") | gsub("ç";"c";"i")
                                    | gsub("[^a-z0-9]+"; "-") | gsub("^-+|-+$"; "") | .[0:24]
                                    | select(length > 0) ]
                                  | reduce .[] as $t ([]; if any(.[]; . == $t) then . else . + [$t] end)
                                  | .[0:8]),
                           homepage: (.homepage // "https://github.com/\($repo)"),
                           apiVersion, permissions }
                         | with_entries(select(.value != null and .value != []))' manifest.json)
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.meta.outputs.asset-name }}
            SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Print registry PR block
        run: |
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat <<EOF
          ====================================================================
          Update https://github.com/Toskan4134/maker-studio-mods/blob/main/index.json
          Top-level field:

            "updatedAt": "$UPDATED_AT",

          Your mod entry:

            "authors": ${{ steps.meta.outputs.authors }},
            "version": "${{ steps.meta.outputs.version }}",
            "assetName": "${{ steps.meta.outputs.asset-name }}",
            "sha256": "${{ steps.hash.outputs.sha256 }}"

          Open a PR with that change. Until the PR is merged, users still install
          the previously approved version.
          ====================================================================
          EOF
